name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pacman contribution graph
        uses: DuyetBKU/viz-pacman-github-profile@main
        with:
          github_user_name: preetham1869
          github_token: ${{ secrets.GITHUB_TOKEN }}
          theme: github-dark
          music: "false"

      - name: Check generated files
        run: |
          echo "Generated files:"
          find dist -maxdepth 2 -type f -print

      - name: Push Pacman SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
