name: Update GitHub Contribution Streak

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Contribution Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          username: preetham1869
          output_path: github-streak-stats.svg
          background: "050505"
          ring: "F5F5F5"
          fire: "F5F5F5"
          curr_streak_label: "F5F5F5"
          side_labels: "D6D9DC"
          curr_streak_num: "F5F5F5"
          side_nums: "C7CBD1"
          dates: "8F949B"
          hide_border: true
          disable_animations: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated streak
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add github-streak-stats.svg

          git commit -m "Update Streak Stats [skip ci]" || exit 0

          git pull --rebase origin main
          git push origin main
