name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: preetham1869
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F5F5F5&color_dots=#080808,#30343B,#8F949B,#C7CBD1,#F5F5F5
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFFFFF&color_dots=#080808,#30343B,#8F949B,#C7CBD1,#F5F5F5

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
